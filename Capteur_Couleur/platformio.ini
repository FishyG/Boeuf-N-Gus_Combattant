; Programme de test et de calibration du capteur de couleur (Grove I2C Color Sensor v2.0, TCS34725)
[platformio]
build_dir = build
libdeps_dir = build/piolibdeps

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =  https://github.com/UdeS-GRO/LibRobUS
            adafruit/Adafruit TCS34725@^1.4.4
monitor_speed = 9600              ; LibRobUS ouvre le Serial a 9600 dans BoardInit()
