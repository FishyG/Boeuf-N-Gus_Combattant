; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
build_dir = build
libdeps_dir = build/piolibdeps

; Chaque programme liste ses fichiers (un seul setup() et loop() par programme)

; Programme de course : leur suiveur de ligne + capteur de couleur
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =  https://github.com/UdeS-GRO/LibRobUS
            adafruit/Adafruit TCS34725@^1.4.4
monitor_speed = 9600
build_src_filter = +<main.cpp> +<color.cpp>

; Calibration et tests du capteur de couleur (le robot ne bouge pas)
[env:test_couleur]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =  https://github.com/UdeS-GRO/LibRobUS
            adafruit/Adafruit TCS34725@^1.4.4
monitor_speed = 9600
build_src_filter = +<color.cpp> +<test_color.cpp> +<test_main_color.cpp>

; Leur suiveur de ligne seul (code original)
[env:suiveur_ligne]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =  https://github.com/UdeS-GRO/LibRobUS
monitor_speed = 9600
build_src_filter = +<suiveur_ligne.cpp>

; BACKUP : nouveau suiveur de ligne + capteur de couleur
[env:nouveau_main]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =  https://github.com/UdeS-GRO/LibRobUS
            adafruit/Adafruit TCS34725@^1.4.4
monitor_speed = 9600
build_src_filter = +<nouveau_main.cpp> +<nouveau_suiveur_ligne.cpp> +<color.cpp>

; BACKUP : nouveau suiveur de ligne seul (bumper arriere = partir, bumper avant = arreter)
[env:nouveau_suiveur]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =  https://github.com/UdeS-GRO/LibRobUS
monitor_speed = 9600
build_src_filter = +<nouveau_suiveur_ligne.cpp> +<nouveau_test_suiveur.cpp>
